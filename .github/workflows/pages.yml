name: Deploy 3D World to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
      - "claude/**"
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write  # needed to push to gh-pages branch

jobs:
  build-and-deploy:
    name: Build and deploy 3D world
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static 3D world
        run: npm run pages:build
        env:
          # GITHUB_REPOSITORY is automatically set by Actions (e.g. "decentralize-dfw/hyperfy")
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The branch that contains the world source files and receives editor saves
          PAGES_BRANCH: ${{ github.ref_name }}

      # Push the built output to the gh-pages branch.
      # GitHub Pages → Settings → Pages → Source: Deploy from branch → gh-pages / (root)
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/pages   # directory produced by npm run pages:build
          branch: gh-pages      # target branch GitHub Pages will serve
          clean: true           # remove stale files on each deploy
